name: CI — Build, Typecheck & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: TypeScript Build & Jest Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lendsqr_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Run unit & concurrency tests (in-memory PG engine)
        run: npm test

      - name: Run full test suite against real PostgreSQL 16 service
        env:
          NODE_ENV: test
          USE_REAL_PG: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lendsqr_wallet_test
          JWT_SECRET: ci-test-jwt-secret-key-2026-lendsqr
          ADMIN_API_KEY: ci-test-admin-key-2026
        run: npm test
